<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Study Quiz Pro</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:Arial,sans-serif;
  min-height:100vh;
  color:white;
  background:
    linear-gradient(rgba(20,30,70,.75),rgba(5,10,30,.9)),
    url("https://images.unsplash.com/photo-1497633762265-9d179a990aa6?auto=format&fit=crop&w=1200&q=80")
    center/cover fixed;
}

.container{
  width:94%;
  max-width:700px;
  margin:auto;
  padding:25px 0;
}

.screen{display:none}
.active{display:block}

.card{
  background:rgba(255,255,255,.12);
  backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,.25);
  border-radius:22px;
  padding:25px;
  margin-top:20px;
  box-shadow:0 10px 35px rgba(0,0,0,.35);
}

h1{
  text-align:center;
  font-size:38px;
  margin-top:45px;
}

.subtitle{
  text-align:center;
  margin:12px 0 30px;
  opacity:.9;
}

button{
  width:100%;
  border:0;
  border-radius:14px;
  padding:15px;
  margin-top:12px;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
  background:#ffffff;
  color:#172554;
}

button:hover{transform:scale(1.02)}

.back{
  background:rgba(255,255,255,.18);
  color:white;
}

.levels{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  margin-top:20px;
}

.level{
  padding:20px 8px;
  border-radius:15px;
  background:#2563eb;
  color:white;
}

.locked{
  background:#555;
  opacity:.6;
}

.subjects{
  display:grid;
  gap:14px;
}

.subject{
  padding:22px;
  border-radius:18px;
  font-size:20px;
  font-weight:bold;
  background:rgba(255,255,255,.15);
  cursor:pointer;
}

.question{
  font-size:22px;
  line-height:1.4;
  margin:20px 0;
}

.option{
  background:rgba(255,255,255,.12);
  color:white;
  border:1px solid rgba(255,255,255,.25);
  text-align:left;
}

.progress{
  height:10px;
  background:rgba(255,255,255,.2);
  border-radius:10px;
  overflow:hidden;
  margin:15px 0;
}

.progress-bar{
  height:100%;
  width:0%;
  background:#22c55e;
}

.score{
  text-align:center;
  font-size:25px;
  margin:20px;
}

.small{
  text-align:center;
  opacity:.8;
  margin-top:15px;
}

.correct{background:#16a34a!important}
.wrong{background:#dc2626!important}
</style>
</head>

<body>

<div class="container">

<!-- HOME -->
<div id="home" class="screen active">
  <h1>📚 Study Quiz Pro</h1>
  <p class="subtitle">Physics • Chemistry • Mathematics</p>

  <div class="card">
    <p style="text-align:center;font-size:18px">
      🎯 Complete all three subjects to unlock the next level.
    </p>

    <button onclick="showLevels()">▶ Play Game</button>
  </div>
</div>

<!-- LEVELS -->
<div id="levelsScreen" class="screen">
  <div class="card">
    <h2>🏆 Select Level</h2>
    <div id="levels" class="levels"></div>
    <button class="back" onclick="goHome()">← Back</button>
  </div>
</div>

<!-- SUBJECTS -->
<div id="subjectScreen" class="screen">
  <div class="card">
    <h2 id="levelTitle">Level 1</h2>
    <p class="small">Complete Physics, Chemistry and Maths.</p>

    <div class="subjects">
      <div class="subject" onclick="startQuiz('Physics')">
        ⚡ Physics
        <span id="physicsStatus">🔒</span>
      </div>

      <div class="subject" onclick="startQuiz('Chemistry')">
        🧪 Chemistry
        <span id="chemistryStatus">🔒</span>
      </div>

      <div class="subject" onclick="startQuiz('Maths')">
        📐 Mathematics
        <span id="mathsStatus">🔒</span>
      </div>
    </div>

    <button class="back" onclick="showLevels()">← Levels</button>
  </div>
</div>

<!-- QUIZ -->
<div id="quizScreen" class="screen">
  <div class="card">
    <h2 id="quizTitle">Physics</h2>

    <div class="progress">
      <div id="progressBar" class="progress-bar"></div>
    </div>

    <p id="questionNumber"></p>
    <div id="question" class="question"></div>

    <div id="options"></div>

    <p id="quizScore" class="small"></p>
  </div>
</div>

<!-- RESULT -->
<div id="resultScreen" class="screen">
  <div class="card">
    <h2 style="text-align:center">🎉 Quiz Complete!</h2>

    <div id="resultText" class="score"></div>

    <button onclick="backToSubjects()">Continue</button>
  </div>
</div>

</div>

}


/* =========================
   SCREEN SYSTEM
========================= */

function hideAll(){
  document.querySelectorAll(".screen")
  .forEach(s=>s.classList.remove("active"));
}

function showLevels(){
  hideAll();
  document.getElementById("levelsScreen").classList.add("active");
  renderLevels();
}

function goHome(){
  hideAll();
  document.getElementById("home").classList.add("active");
}


/* =========================
   LEVEL SYSTEM
========================= */

function renderLevels(){

  const box=document.getElementById("levels");
  box.innerHTML="";

  for(let i=1;i<=15;i++){

    const unlocked=i===1 || 
      (
        progressData[i-1].Physics &&
        progressData[i-1].Chemistry &&
        progressData[i-1].Maths
      );

    const btn=document.createElement("button");

    btn.className="level "+(!unlocked?"locked":"");

      "LEVEL "+i :
      "🔒 LEVEL "+i;

    if(unlocked){
      btn.onclick=()=>selectLevel(i);
    }

    box.appendChild(btn);
  }
}
