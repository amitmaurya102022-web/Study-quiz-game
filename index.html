<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>12th PCM 1800 Balanced</title>
<style>body{background:#0f172a;color:#fff;font-family:system-ui;margin:0;padding:8px}.h{background:linear-gradient(90deg,#6a11cb,#2575fc);padding:16px;text-align:center;border-radius:12px;position:sticky;top:0;z-index:10}.ad{background:#1e293b;margin:10px 0;padding:10px;text-align:center;border:1px dashed #475569;border-radius:8px;color:#94a3b8;font-size:12px}.g{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.c{background:#1e293b;padding:12px;text-align:center;border-radius:12px;border:2px solid #334155}.c.ok{border-color:#22c55e}.b{width:100%;padding:6px;margin-top:6px;border:0;border-radius:6px;font-weight:bold}.play{background:#22c55e;color:#fff}#quiz{position:fixed;inset:0;background:#0f172a;z-index:99;display:none;padding:14px;overflow:auto}.opt{background:#1e293b;padding:12px;margin:7px 0;border-radius:10px;border:1px solid #475569}.opt.correct{background:#16a34a!important}.opt.wrong{background:#dc2626!important}</style></head><body>
<div class="h"><h2>📚 12th PCM MASTER</h2><p>BOARD + NCERT + JEE | 1800 Qs | A,B,C,D Balanced</p></div><div class="ad">AD TOP - AdSense</div><div id="lv" class="g"></div><div class="ad">AD BOTTOM</div>
<div id="quiz"><h3 id="qt"></h3><div style="background:#334155;height:6px;border-radius:10px;margin:10px 0"><div id="bar" style="height:100%;background:#22c55e;width:0%"></div></div><h2 id="qtx" style="margin:14px 0;line-height:1.3;font-size:18px"></h2><div id="qo"></div><button onclick="document.getElementById('quiz').style.display='none'" style="width:100%;padding:12px;margin-top:12px;background:#334155;color:#fff;border:0;border-radius:10px">✖ Exit</button></div>
<script>
const POOL_PHY=[["Electric flux SI unit?",["Nm2/C","N/C","C/m2","V/m"]],["Coulomb F proportional?",["q1q2/r2","q1+q2","r2/q1q2","q1-q2"]],["Capacitor energy stored in?",["Electric field","Magnetic field","Both","None"]],["Ohm law valid for?",["Ohmic conductors","All conductors","Semiconductor","Insulator"]],["Kirchhoff 1st law based on?",["Charge conservation","Energy cons","Momentum","Mass cons"]],["Magnetic field unit?",["Tesla","Weber","Henry","Farad"]],["Lenz law is based on?",["Energy conservation","Charge cons","Momentum cons","Mass cons"]],["AC RMS value is?",["0.707 Peak","0.5 Peak","Equal to Peak","2x Peak"]],["Transformer works on?",["Mutual induction","Self induction","Lenz law","Faraday law"]],["Refractive index n=?",["c/v","v/c","c*v","c+v"]],["TIR condition?",["Denser to rarer","Rarer to denser","Same medium","Any medium"]],["Lens maker formula?",["1/f=(u-1)(1/R1-1/R2)","1/f=R1+R2","f=R1R2","None"]],["De-Broglie wavelength?",["h/p","p/h","h.p","p2/h"]],["Photoelectric KE depends on?",["Frequency","Intensity","Both","None"]],["Nucleus size order?",["1e-15 m","1e-10 m","1e-6 m","1e-8 m"]],["p-n junction barrier?",["0.3-0.7V","10V","100V","0V"]],["Zener diode used as?",["Voltage regulator","Amplifier","Rectifier","Oscillator"]],["EM wave E and B are?",["Perpendicular","Parallel","Same direction","Opposite"]],["Wheatstone balanced?",["P/Q=R/S","P+Q=R+S","PQ=RS","P-Q=R-S"]],["Potentiometer better?",["No current drawn","High current","Cheap","Easy"]],];
const POOL_CHE=[["Solid particles are?",["Close packed","Far apart","Random","None"]],["Molarity formula?",["moles per Litre","moles per kg","grams per L","L per mole"]],["Osmotic pressure pi=?",["CRT","RT/C","C/RT","CR/T"]],["Rate of reaction depends on?",["Concentration","Volume","Mass","Colour"]],["First order half life?",["0.693/k","k/0.693","1/k","k"]],["Galvanic cell anode is?",["Negative","Positive","Neutral","Both"]],["Conductivity unit?",["S/m","Ohm","Ohm inverse","m/S"]],["Adsorption enthalpy?",["Negative","Positive","Zero","Infinite"]],["Colloid example?",["Milk","Water","Salt solution","Sugar"]],["Aluminium ore?",["Bauxite","Haematite","Cinnabar","Galena"]],["Lanthanoid contraction due to?",["Poor shielding of 4f","Good shielding","Large size","High charge"]],["KMnO4 Mn oxidation state?",["+7","+6","+4","+2"]],["SN1 intermediate?",["Carbocation","Carbanion","Free radical","None"]],["C-X bond in haloalkane?",["Polar","Non-polar","Ionic","Metallic"]],["Alcohol to alkene reagent?",["Conc. H2SO4","HCl","NaOH","H2O"]],["Phenol acidic due to?",["Resonance stabilization","Inductive effect","Both","None"]],["Aldehyde test?",["Tollens test","Biuret test","Molisch test","Iodoform"]],["Amine N hybridization?",["sp3","sp2","sp","dsp2"]],["Protein linkage?",["Peptide bond","Glycosidic bond","Phosphodiester","H-bond"]],["Sugar in DNA?",["Deoxyribose","Ribose","Glucose","Fructose"]],];
const POOL_MATH=[["Relation {(1,2)} is?",["Transitive only","Symmetric","Reflexive","Equivalence"]],["If det A=2, det(2A) 3x3=?",["16","8","4","2"]],["Matrix inverse exists if?",["det not zero","det zero","Always","Only square"]],["Derivative of sin inverse x?",["1/sqrt(1-x2)","-1/sqrt(1-x2)","1/(1+x2)","-1/(1+x2)"]],["Integration e^x?",["e^x + C","e^x/x","ln x","0"]],["Integration 1/x?",["ln|x|+C","x+C","1/x2","e^x"]],["Order of dy/dx + y = x?",["1","2","0","3"]],["Vector a dot a =?",["|a| squared","|a|","0","1"]],["a cross b is?",["Perp to a,b","Parallel to a,b","Zero","Scalar"]],["Line r=a+Lb, b is?",["Direction vector","Point on line","Normal vector","Tangent"]],["Feasible region in LPP is?",["Convex","Concave","Circle","Line"]],["P(A)+P(not A)=?",["1","0","0.5","2"]],["Mean of 2,4,6?",["4","6","3","12"]],["Limit sinx/x as x->0?",["1","0","Infinity","-1"]],["Continuity at x=a requires?",["Limit = f(a)","Limit exists only","f(a) exists only","None"]],["For maxima f double prime?",["Less than 0","Greater than 0","Equal to 0","Greater equal 0"]],["Property integral 0 to a f(x)=0 to a f(a-x)?",["Property 4","Property 1","Property 2","Property 3"]],["Area under y=x from 0 to1?",["0.5","1","2","0"]],["Solution of dy/dx = y?",["C e^x","C x","C+x","e^x+C"]],["Distance formula 3D?",["sqrt((x2-x1)2+...)","x2-x1","|x2-x1|","None"]],];
function shuffle(arr,seed){let a=arr.slice();let s=seed;for(let i=a.length-1;i>0;i--){s=(s*1103515245+12345)%2147483648;let j=s%(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
const BANK={};for(let L=1;L<=30;L++){let t=L<=10?'BOARD 12th':L<=20?'NCERT 12th':'JEE 12th';BANK[L]=[];for(let i=0;i<60;i++){let sub=['Phy','Che','Math'][i%3];let pool=sub=='Phy'?POOL_PHY:sub=='Che'?POOL_CHE:POOL_MATH;let base=pool[(L*3+i*7)%pool.length];let q=base[0];let opts=base[1];let correct=opts[0];let shuffled=shuffle(opts,L*1000+i*17);let ans=shuffled.indexOf(correct);BANK[L].push({q:`[${t}-${sub}-L${L}] ${q}`,o:shuffled,a:ans,s:sub});}}
let ul=parseInt(localStorage.getItem('ul12b')||'1');function draw(){let h='';for(let i=1;i<=30;i++){let ty=i<=10?'BOARD 12th':i<=20?'NCERT 12th':'JEE 12th';let col=ty.includes('BOARD')?'#f59e0b':ty.includes('NCERT')?'#3b82f6':'#ef4444';let lk=i>ul;h+=`<div class="c ${lk?'':'ok'}"><div style="font-size:22px;font-weight:bold">${i}</div><div style="font-size:9px;background:${col};padding:2px 6px;border-radius:10px;display:inline-block">${ty}</div><br><small>60 Qs</small><br>${lk?'<button class=b>🔒 Locked</button>':`<button class="b play" onclick="play(${i})">PLAY ▶</button>`}</div>`}document.getElementById('lv').innerHTML=h}draw();let cur,idx,sc,cl;function play(l){cl=l;cur=BANK[l];idx=0;sc=0;document.getElementById('quiz').style.display='block';show()}function show(){let qq=cur[idx];document.getElementById('qt').innerText=`Level ${cl} - ${qq.s} - Q ${idx+1}/60`;document.getElementById('qtx').innerText=qq.q;document.getElementById('bar').style.width=(idx/60*100)+'%';document.getElementById('qo').innerHTML=qq.o.map((oo,i)=>`<div class=opt onclick="ans(${i})">${String.fromCharCode(65+i)}. ${oo}</div>`).join('')}function ans(i){let qq=cur[idx];let els=document.querySelectorAll('.opt');els.forEach(e=>e.style.pointerEvents='none');if(i==qq.a){els[i].classList.add('correct');sc++}else{els[i].classList.add('wrong');els[qq.a].classList.add('correct')}setTimeout(()=>{idx++;if(idx<cur.length)show();else{alert(`Level ${cl} Complete! Score ${sc}/60`);if(sc>=30&&cl==ul&&ul<30){ul++;localStorage.setItem('ul12b',ul)}document.getElementById('quiz').style.display='none';draw()}},700)}
</script></body></html>
