<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<meta name="theme-color" content="#4f46e5">

<title>Study Quiz Pro</title>

<!-- STUDY QUIZ PRO ICON -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='100' fill='%234f46e5'/%3E%3Cpath d='M256 80L60 175l196 90 196-90z' fill='%23111827'/%3E%3Cpath d='M120 215v80c0 55 60 90 136 90s136-35 136-90v-80l-136 65z' fill='%23232b3b'/%3E%3Cpath d='M430 180v135' stroke='%23facc15' stroke-width='14'/%3E%3Ccircle cx='430' cy='330' r='18' fill='%23facc15'/%3E%3Cpath d='M105 385c50-25 100-25 151 5v65c-51-30-101-30-151-5z' fill='white'/%3E%3Cpath d='M407 385c-50-25-100-25-151 5v65c51-30 101-30 151-5z' fill='%23e5e7eb'/%3E%3Ctext x='256' y='495' text-anchor='middle' font-family='Arial' font-size='38' font-weight='bold' fill='white'%3EQUIZ%3C/text%3E%3C/svg%3E">

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:Arial,sans-serif;
min-height:100vh;
background:
radial-gradient(circle at 20% 20%,#6366f1 0%,transparent 30%),
radial-gradient(circle at 80% 80%,#7c3aed 0%,transparent 30%),
linear-gradient(135deg,#080b18,#312e81);
color:white;
}

body:before{
content:"🎓   📚   🧪   ⚡   ∑   🔬";
position:fixed;
inset:0;
font-size:55px;
opacity:.035;
line-height:2;
word-spacing:50px;
pointer-events:none;
}

.app{
width:100%;
max-width:900px;
margin:auto;
padding:18px;
position:relative;
z-index:2;
}

.screen{
display:none;
}

.screen.active{
display:block;
}

.card{
background:rgba(255,255,255,.12);
border:1px solid rgba(255,255,255,.2);
backdrop-filter:blur(18px);
border-radius:28px;
padding:25px;
box-shadow:0 20px 60px rgba(0,0,0,.3);
}

.logo{
width:110px;
height:110px;
margin:15px auto;
border-radius:28px;
background:linear-gradient(135deg,#4f46e5,#7c3aed);
display:flex;
align-items:center;
justify-content:center;
font-size:60px;
box-shadow:0 15px 30px rgba(0,0,0,.3);
}

.title{
text-align:center;
font-size:40px;
font-weight:900;
margin:12px 0;
}

.subtitle{
text-align:center;
font-size:18px;
opacity:.8;
margin-bottom:25px;
}

.stats{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:12px;
margin:20px 0;
}

.stat{
background:rgba(0,0,0,.18);
border-radius:18px;
padding:17px 8px;
text-align:center;
}

.stat strong{
font-size:27px;
display:block;
}

.stat span{
font-size:14px;
opacity:.8;
}

.btn{
width:100%;
padding:17px;
margin-top:12px;
border:none;
border-radius:17px;
font-size:18px;
font-weight:bold;
cursor:pointer;
background:white;
color:#312e81;
box-shadow:0 8px 20px rgba(0,0,0,.2);
}

.btn:active{
transform:scale(.98);
}

.btn.secondary{
background:rgba(255,255,255,.12);
border:1px solid rgba(255,255,255,.25);
color:white;
}

.top{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
}

.small{
padding:10px 14px;
border:0;
border-radius:12px;
font-weight:bold;
cursor:pointer;
}

.levelGrid{
display:grid;
grid-template-columns:repeat(5,1fr);
gap:12px;
}

.level{
height:68px;
border:0;
border-radius:16px;
font-size:19px;
font-weight:bold;
cursor:pointer;
background:white;
color:#312e81;
}

.level.done{
background:#22c55e;
color:white;
}

.level.lock{
background:rgba(255,255,255,.1);
color:#aaa;
cursor:not-allowed;
}

.badge{
display:inline-block;
padding:8px 15px;
background:#22c55e;
border-radius:30px;
font-weight:bold;
margin-bottom:15px;
}

.subject{
display:inline-block;
background:#f59e0b;
padding:7px 15px;
border-radius:20px;
font-weight:bold;
}

.qnumber{
opacity:.7;
margin-top:10px;
}

.progress{
height:10px;
background:rgba(255,255,255,.15);
border-radius:20px;
overflow:hidden;
margin:15px 0 25px;
}

.progressBar{
height:100%;
width:0;
background:#22c55e;
transition:.3s;
}

.question{
font-size:24px;
font-weight:bold;
line-height:1.5;
margin-bottom:22px;
}

.options{
display:grid;
gap:12px;
}

.option{
width:100%;
padding:16px;
border-radius:15px;
border:1px solid rgba(255,255,255,.2);
background:rgba(255,255,255,.1);
color:white;
text-align:left;
font-size:17px;
cursor:pointer;
}

.option.correct{
background:#16a34a;
}

.option.wrong{
background:#dc2626;
}

.resultIcon{
font-size:75px;
text-align:center;
}

.resultTitle{
text-align:center;
font-size:30px;
margin:10px;
}

.resultScore{
text-align:center;
font-size:50px;
font-weight:bold;
}

.center{
text-align:center;
}

.footer{
text-align:center;
opacity:.6;
font-size:13px;
margin-top:25px;
}

@media(max-width:600px){

.app{
padding:12px;
}

.card{
padding:18px;
}

.title{
font-size:31px;
}

.levelGrid{
grid-template-columns:repeat(3,1fr);
}

.question{
font-size:20px;
}

.logo{
width:90px;
height:90px;
font-size:48px;
}

}

</style>
</head>

<body>

<div class="app">

<!-- HOME -->

<section id="home" class="screen active">

<div class="card">

<div class="logo">🎓</div>

<h1 class="title">Study Quiz Pro</h1>

<p class="subtitle">
Physics • Chemistry • Mathematics
</p>

<div class="stats">

<div class="stat">
<strong id="levelStat">1</strong>
<span>Level</span>
</div>

<div class="stat">
<strong id="scoreStat">0</strong>
<span>High Score</span>
</div>

<div class="stat">
<strong>1800</strong>
<span>Questions</span>
</div>

</div>

<button class="btn" onclick="showLevels()">
▶ PLAY GAME
</button>

<button class="btn secondary" onclick="downloadGame()">
📥 DOWNLOAD GAME
</button>

<button class="btn secondary" onclick="resetProgress()">
🔄 RESET PROGRESS
</button>

<div class="footer">
30 Levels × 60 Questions = 1800 Questions
</div>

</div>

</section>


<!-- LEVELS -->

<section id="levels" class="screen">

<div class="card">

<div class="top">
<button class="small" onclick="showHome()">← Home</button>
<b>Select Level</b>
</div>

<div class="center">
<div class="badge">
🔓 Level <span id="unlockedText">1</span> Unlocked
</div>
</div>

<div id="levelGrid" class="levelGrid"></div>

<div class="footer">
Complete 60 questions to unlock the next level.
</div>

</div>

</section>


<!-- QUIZ -->

<section id="quiz" class="screen">

<div class="card">

<div class="top">
<button class="small" onclick="showLevels()">← Levels</button>
<b id="levelName">Level 1</b>
</div>

<span id="subject" class="subject">
Physics
</span>

<div id="qnumber" class="qnumber">
Question 1 / 60
</div>

<div class="progress">
<div id="progressBar" class="progressBar"></div>
</div>

<div id="question" class="question"></div>

<div id="options" class="options"></div>

</div>

</section>


<!-- RESULT -->

<section id="result" class="screen">

<div class="card center">

<div class="resultIcon">🏆</div>

<h2 id="resultTitle" class="resultTitle">
Level Complete!
</h2>

<div id="resultScore" class="resultScore">
0 / 60
</div>

<p id="resultText"></p>

<button class="btn" onclick="continueGame()">
CONTINUE
</button>

<button class="btn secondary" onclick="showLevels()">
📚 LEVELS
</button>

</div>

</section>

</div>


<script>

/* =========================
GAME DATA
========================= */

const TOTAL_LEVELS=30;
const PER_LEVEL=60;

let bank=[];
let questions=[];
let index=0;
let score=0;
let level=1;

let unlocked=
Number(localStorage.getItem("studyUnlocked"))||1;

let highScore=
Number(localStorage.getItem("studyHighScore"))||0;


/* =========================
QUESTION CREATOR
========================= */

function Q(subject,text,options,answer){

return{
subject:subject,
text:text,
options:options,
answer:answer
};

}


/* =========================
PHYSICS
========================= */

const physics=[

Q("Physics",
"If distance between two charges is doubled, force becomes:",
["2F","F/2","F/4","4F"],2),

Q("Physics",
"Electric field is defined as:",
["F/q","q/F","Fq","F+q"],0),

Q("Physics",
"SI unit of electric field is:",
["N/C","C/N","J/C","W"],0),

Q("Physics",
"SI unit of electric potential is:",
["Volt","Newton","Tesla","Ampere"],0),

Q("Physics",
"Electric flux through a closed surface depends on:",
["Enclosed charge","Mass","Colour","Area only"],0),

Q("Physics",
"Capacitance is:",
["Q/V","V/Q","QV","Q+V"],0),

Q("Physics",
"Two capacitors in parallel have equivalent capacitance:",
["C1+C2","C1C2","C1-C2","C1/C2"],0),

Q("Physics",
"Ohm's law is:",
["V=IR","V=I/R","I=VR","R=VI"],0),

Q("Physics",
"Electrical power is:",
["VI","V/I","I/V","V+I"],0),

Q("Physics",
"SI unit of resistance is:",
["Ohm","Volt","Watt","Tesla"],0),

Q("Physics",
"Magnetic force is maximum when angle between v and B is:",
["0°","30°","90°","180°"],2),

Q("Physics",
"Force on current carrying wire is:",
["BIL sinθ","BI/L","BL/I","B+I+L"],0),

Q("Physics",
"Faraday's law is related to:",
["Electromagnetic induction","Gravitation","Heat","Sound"],0),

Q("Physics",
"Transformer works on:",
["Mutual induction","Reflection","Refraction","Diffraction"],0),

Q("Physics",
"Power of a lens of focal length 0.5 m is:",
["0.5D","1D","2D","5D"],2),

Q("Physics",
"Refractive index is:",
["c/v","v/c","cv","c+v"],0),

Q("Physics",
"Wave velocity is:",
["fλ","f/λ","λ/f","f+λ"],0),

Q("Physics",
"Photoelectric effect mainly depends on light:",
["Frequency","Colour of metal only","Mass","Area"],0),

Q("Physics",
"Half-life is the time in which:",
["Half nuclei decay","All nuclei decay","No nuclei decay","Double nuclei form"],0),

Q("Physics",
"A semiconductor conductivity lies between:",
["Conductor and insulator","Two conductors","Two insulators","Vacuum"],0)

];


/* =========================
CHEMISTRY
========================= */

const chemistry=[

Q("Chemistry",
"Molarity means moles of solute per:",
["Litre of solution","Kg solvent","Gram solution","Litre solvent"],0),

Q("Chemistry",
"Molality means moles of solute per:",
["Kg solvent","Litre solution","Gram solute","Mole solvent"],0),

Q("Chemistry",
"Oxidation occurs at:",
["Anode","Cathode","Salt bridge","Electrolyte"],0),

Q("Chemistry",
"Reduction occurs at:",
["Cathode","Anode","Salt bridge","Wire"],0),

Q("Chemistry",
"SI unit of conductivity is:",
["S m⁻¹","Ohm","Volt","Coulomb"],0),

Q("Chemistry",
"Half-life of first order reaction is:",
["Independent of initial concentration","Always zero","Infinite","Always changing"],0),

Q("Chemistry",
"A catalyst changes:",
["Activation energy","Atomic number","Mass","Equilibrium constant"],0),

Q("Chemistry",
"pH of neutral water at 25°C is:",
["0","5","7","14"],2),

Q("Chemistry",
"A ligand donates electron pair to:",
["Central metal ion","Proton only","Solvent","Anion only"],0),

Q("Chemistry",
"NH3 is a:",
["Monodentate ligand","Bidentate ligand","Tridentate ligand","No ligand"],0),

Q("Chemistry",
"Formula of ethane is:",
["C2H6","C2H4","C2H2","CH4"],0),

Q("Chemistry",
"Functional group of alcohol is:",
["OH","CHO","COOH","NH2"],0),

Q("Chemistry",
"Functional group of aldehyde is:",
["CHO","OH","COOH","NH2"],0),

Q("Chemistry",
"Functional group of carboxylic acid is:",
["COOH","OH","CHO","NH2"],0),

Q("Chemistry",
"Functional group of amine is:",
["NH2","OH","CHO","COOH"],0),

Q("Chemistry",
"Formula of benzene is:",
["C6H6","C6H12","C5H6","C7H8"],0),

Q("Chemistry",
"PVC is a:",
["Polymer","Protein","Carbohydrate","Metal"],0),

Q("Chemistry",
"Proteins are polymers of:",
["Amino acids","Glucose","Fatty acids","Water"],0),

Q("Chemistry",
"Glucose is a:",
["Carbohydrate","Protein","Metal","Polymer only"],0),

Q("Chemistry",
"Coordination compounds contain:",
["Central metal ion and ligands","Only carbon","Only hydrogen","Only oxygen"],0)

];


/* =========================
MATHEMATICS
========================= */

const maths=[

Q("Mathematics",
"Derivative of xⁿ is:",
["nxⁿ⁻¹","xⁿ⁺¹","nxⁿ","xⁿ/n"],0),

Q("Mathematics",
"∫xⁿ dx is:",
["xⁿ⁺¹/(n+1)+C","nxⁿ⁻¹+C","xⁿ/n+C","lnx+C"],0),

Q("Mathematics",
"∫1/x dx is:",
["ln|x|+C","x+C","1/x+C","eˣ+C"],0),

Q("Mathematics",
"Derivative of sin x is:",
["cos x","-cos x","tan x","sin x"],0),

Q("Mathematics",
"Derivative of cos x is:",
["-sin x","sin x","cos x","tan x"],0),

Q("Mathematics",
"Derivative of tan x is:",
["sec²x","cosec²x","tan²x","sinx"],0),

Q("Mathematics",
"tan⁻¹(1) is:",
["π/4","π/2","π","0"],0),

Q("Mathematics",
"Determinant of [[a,b],[c,d]] is:",
["ad-bc","ab-cd","ac-bd","a+b+c+d"],0),

Q("Mathematics",
"Determinant of identity matrix is:",
["0","1","2","-1"],1),

Q("Mathematics",
"For continuity at x=a:",
["LHL=RHL=f(a)","LHL≠RHL","f(a)=0","Derivative=0"],0),

Q("Mathematics",
"∫eˣ dx is:",
["eˣ+C","xeˣ+C","lnx+C","1/eˣ+C"],0),

Q("Mathematics",
"∫cos x dx is:",
["sin x+C","-sin x+C","cos x+C","tan x+C"],0),

Q("Mathematics",
"Order of differential equation means highest:",
["Derivative order","Power","Coefficient","Constant"],0),

Q("Mathematics",
"Dot product of perpendicular vectors is:",
["0","1","-1","∞"],0),

Q("Mathematics",
"Magnitude of ai+bj+ck is:",
["√(a²+b²+c²)","a+b+c","abc","a²+b²+c²"],0),

Q("Mathematics",
"Probability of a certain event is:",
["0","1","1/2","-1"],1),

Q("Mathematics",
"Probability of impossible event is:",
["0","1","1/2","-1"],0),

Q("Mathematics",
"P(A|B) equals:",
["P(A∩B)/P(B)","P(A)+P(B)","P(A)-P(B)","P(A)P(B)"],0),

Q("Mathematics",
"3D distance formula uses:",
["√[(x2-x1)²+(y2-y1)²+(z2-z1)²]","x+y+z","xyz","x2-x1"],0),

Q("Mathematics",
"Linear programming objective function is used to:",
["Maximize or minimize","Find pH","Find derivative only","Find determinant"],0)

];


/* =========================
CREATE 1800 QUESTIONS
========================= */

function createBank(){

bank=[];

for(let l=1;l<=TOTAL_LEVELS;l++){

physics.forEach(q=>{
bank.push({...q,level:l});
});

chemistry.forEach(q=>{
bank.push({...q,level:l});
});

maths.forEach(q=>{
bank.push({...q,level:l});
});

}

}

createBank();


/* =========================
SCREEN
========================= */

function hide(){

document.querySelectorAll(".screen")
.forEach(x=>x.classList.remove("active"));

}

function showHome(){

hide();

document
.getElementById("home")
.classList.add("active");

updateHome();

}

function showLevels(){

hide();

document
.getElementById("levels")
.classList.add("active");

renderLevels();

}


/* =========================
HOME
========================= */

function updateHome(){

document.getElementById("levelStat")
.textContent=unlocked;

document.getElementById("scoreStat")
.textContent=highScore;

}


/* =========================
LEVELS
========================= */

function renderLevels(){

const grid=
document.getElementById("levelGrid");

grid.innerHTML="";

document.getElementById("unlockedText")
.textContent=unlocked;

for(let i=1;i<=TOTAL_LEVELS;i++){

const b=document.createElement("button");

b.className="level";

if(i<unlocked){

b.classList.add("done");
b.textContent="✓ "+i;

}

else if(i===unlocked){

b.textContent="▶ "+i;

}

else{

b.classList.add("lock");
b.textContent="🔒 "+i;
b.disabled=true;

}

if(i<=unlocked){

b.onclick=()=>{
startLevel(i);
};

}

grid.appendChild(b);

}

}


/* =========================
START
========================= */

function startLevel(l){

level=l;

score=0;
index=0;

questions=bank
.filter(q=>q.level===l);

questions=shuffle(questions);

document.getElementById("levelName")
.textContent="Level "+l;

hide();

document
.getElementById("quiz")
.classList.add("active");

showQuestion();

}


/* =========================
SHUFFLE
========================= */

function shuffle(array){

return [...array]
.sort(()=>Math.random()-.5);

}


/* =========================
QUESTION
========================= */

function showQuestion(){

if(index>=questions.length){

finish();

return;

}

const q=questions[index];

document.getElementById("subject")
.textContent=q.subject;

document.getElementById("qnumber")
.textContent=
`Question ${index+1} / 60`;

document.getElementById("progressBar")
.style.width=
`${index/60*100}%`;

document.getElementById("question")
.textContent=q.text;

const box=
document.getElementById("options");

box.innerHTML="";

q.options.forEach((op,i)=>{

const b=document.createElement("button");

b.className="option";

b.textContent=
String.fromCharCode(65+i)+". "+op;

b.onclick=()=>answer(i,b);

box.appendChild(b);

});

}


/* =========================
ANSWER
========================= */

function answer(selected,button){

const q=questions[index];

const all=
document.querySelectorAll(".option");

all.forEach(x=>x.disabled=true);

if(selected===q.answer){

button.classList.add("correct");
score++;

}else{

button.classList.add("wrong");

all[q.answer]
.classList.add("correct");

}

setTimeout(()=>{

index++;
showQuestion();

},650);

}


/* =========================
FINISH
========================= */

function finish(){

document.getElementById("progressBar")
.style.width="100%";

if(score>highScore){

highScore=score;

localStorage.setItem(
"studyHighScore",
highScore
);

}

let next=false;

if(level===unlocked &&
level<TOTAL_LEVELS){

unlocked++;

localStorage.setItem(
"studyUnlocked",
unlocked
);

next=true;

}

document.getElementById("resultScore")
.textContent=`${score} / 60`;

if(score>=50){

document.getElementById("resultTitle")
.textContent="🔥 Excellent!";

}

else if(score>=35){

document.getElementById("resultTitle")
.textContent="👏 Great Job!";

}

else{

document.getElementById("resultTitle")
.textContent="💪 Keep Practising!";

}

document.getElementById("resultText")
.textContent=
next
?`🎉 Level ${level+1} unlocked!`
:"You can replay this level.";

hide();

document
.getElementById("result")
.classList.add("active");

}


/* =========================
CONTINUE
========================= */

function continueGame(){

if(level<TOTAL_LEVELS &&
level<unlocked){

startLevel(level+1);

}else{

showLevels();

}

}


/* =========================
DOWNLOAD
========================= */

function downloadGame(){

const source=
"<!DOCTYPE html>\n"+
document.documentElement.outerHTML;

const blob=
new Blob([source],
{type:"text/html"});

const url=
URL.createObjectURL(blob);

const a=
document.createElement("a");

a.href=url;

a.download=
"Study-Quiz-Pro.html";

document.body.appendChild(a);

a.click();

a.remove();

URL.revokeObjectURL(url);

}


/* =========================
RESET
========================= */

function resetProgress(){

if(!confirm(
"Reset all game progress?"
))return;

localStorage.removeItem("studyUnlocked");
localStorage.removeItem("studyHighScore");

unlocked=1;
highScore=0;

updateHome();

alert(
"Progress reset successfully! 🔄"
);

}

updateHome();

</script>

</body>
</html>
