<style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:Arial,sans-serif;min-height:100vh;background:radial-gradient(circle at 20% 20%,rgba(0,220,255,.35),transparent 25%),radial-gradient(circle at 80% 30%,rgba(170,0,255,.35),transparent 25%),linear-gradient(135deg,#164be8,#6b16d9);color:#222}.app{max-width:700px;margin:auto;padding:18px}.header{display:flex;justify-content:space-between;align-items:center;color:white;margin-bottom:20px}.logo{font-size:24px;font-weight:bold}.homeBtn{border:0;border-radius:25px;padding:11px 16px;background:rgba(255,255,255,.2);color:white;font-size:15px}.card{background:rgba(255,255,255,.96);border-radius:30px;padding:25px;box-shadow:0 15px 40px rgba(0,0,0,.25)}.hero{min-height:600px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}.graduation{font-size:80px}.title{color:#4d24a8;font-size:44px;font-weight:bold;margin:15px 0}.subtitle{font-size:20px;margin-bottom:25px}.bigEmoji{font-size:65px;margin:20px}.mainBtn{width:100%;padding:18px;border:0;border-radius:22px;background:linear-gradient(135deg,#396be8,#596eea);color:white;font-size:21px;font-weight:bold;margin-top:14px}.levelTitle{text-align:center;color:#4d24a8;font-size:34px;margin-bottom:20px}.levelGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.level{min-height:115px;border:0;border-radius:22px;font-size:18px;font-weight:bold}.level.open{background:linear-gradient(135deg,#625fe8,#7442c7);color:white}.level.locked{background:#ccc;color:#666}.level.done{background:linear-gradient(135deg,#16b85a,#0c8d42);color:white}.status{text-align:center;margin-bottom:18px;font-weight:bold;color:#555}.progressText{display:flex;justify-content:space-between;font-weight:bold;margin-bottom:7px}.progress{width:100%;height:12px;background:#ddd;border-radius:20px;overflow:hidden;margin-bottom:20px}.progressBar{height:100%;width:0%;background:linear-gradient(90deg,#2471ed,#7939dc)}.questionNo{color:#555;font-weight:bold;margin-bottom:10px}.subjectName{font-size:21px;font-weight:bold;margin-bottom:15px}.question{font-size:21px;font-weight:bold;line-height:1.4;margin-bottom:20px}.option{width:100%;text-align:left;padding:16px;margin:7px 0;border:2px solid #ddd;border-radius:16px;background:white;font-size:17px}.option.correct{background:#baf3ce;border-color:#16a34a}.option.wrong{background:#ffc4c4;border-color:#dc2626}.nextBtn{width:100%;padding:16px;margin-top:15px;border:0;border-radius:18px;background:#4d5fe8;color:white;font-size:18px;font-weight:bold}.score{font-size:50px;font-weight:bold;color:#5424a8;margin:20px;text-align:center}.result{text-align:center}.hidden{display:none!important}
</style>

<body>
<div class="app">
<div class="header"><div class="logo">📚 Study Quiz Pro</div><button class="homeBtn" onclick="showHome()">← Home</button></div>
<section id="home" class="card hero"><div class="graduation">🎓</div><div class="title">Study Quiz Pro</div><div class="subtitle">Learn • Play • Improve 🚀<br><small>1800 Unique Questions</small></div><div class="bigEmoji">📚 🎮 ⚡ 🧪 📐</div><button class="mainBtn" onclick="showLevels()">▶️ PLAY GAME</button><button class="mainBtn" onclick="showHighScore()">🏆 HIGH SCORE</button></section>
<section id="levels" class="card hidden"><h1 class="levelTitle">🎮 SELECT LEVEL</h1><div id="unlockText" class="status"></div><div id="levelGrid" class="levelGrid"></div><button class="mainBtn" onclick="showHome()">← HOME</button></section>
<section id="game" class="card hidden"><div class="progressText"><span id="levelText">LEVEL 1</span><span id="scoreText">Score: 0</span></div><div class="progress"><div id="progressBar" class="progressBar"></div></div><div id="questionNo" class="questionNo"></div><div id="subjectName" class="subjectName"></div><div id="question" class="question"></div><div id="options"></div><button id="nextBtn" class="nextBtn hidden" onclick="nextQuestion()">NEXT →</button></section>
<section id="result" class="card result hidden"><h1>🎉 LEVEL COMPLETE!</h1><div id="finalScore" class="score">0 / 60</div><p id="resultMessage"></p><button class="mainBtn" onclick="showLevels()">🎮 SELECT LEVEL</button><button class="mainBtn" onclick="showHome()">🏠 HOME</button></section>
<section id="highScore" class="card result hidden"><h1>🏆 HIGH SCORE</h1><div id="highScoreValue" class="score">0</div><p>Highest score saved.</p><button class="mainBtn" onclick="showHome()">🏠 HOME</button></section>
</div>
<script>
const TOTAL_LEVELS=30;
const basePhysics=[["If distance between charges doubled, force becomes:",["2 times","4 times","1/2","1/4 times"],3],["SI unit of charge:",["Volt","Coulomb","Newton","Joule"],1],["SI unit of electric field:",["N/C","C/N","J/C","N/m"],0],["Coulomb law proportional to:",["r","r2","1/r2","1/r"],2],["Electric potential unit:",["Volt","Ampere","Ohm","Tesla"],0],["Capacitance unit:",["Ohm","Farad","Henry","Tesla"],1],["Positive charge field:",["Towards","Away","Circular","Zero"],1],["Field inside conductor:",["Max","Zero","Infinite","Negative"],1],["Work on equipotential:",["Max","Zero","Infinite","Negative"],1],["Magnetic field unit:",["Tesla","Volt","Newton","Coulomb"],0],["Lens power unit:",["Metre","Dioptre","Joule","Tesla"],1],["Convex lens f:",["Positive","Negative","Zero","Infinite"],0],["Concave lens:",["Converging","Diverging","Plane","Reflecting"],1],["Light speed:",["3x10^8 m/s","3x10^6","3x10^5","3x10^7"],0],["Frequency unit:",["Hz","N","J","W"],0],["Wavelength symbol:",["λ","μ","ρ","σ"],0],["Ohms law:",["V=IR","P=VI2","I=VR","R=VI"],0],["Resistance unit:",["Ohm","Volt","Ampere","Watt"],0],["Power P=",["VI","V/I","I/V","IR"],0],["Transformer:",["EMI","Photoelectric","Reflection","Diffraction"],0],["Lenz law conservation:",["Charge","Energy","Momentum","Mass"],1],["Inductance unit:",["Henry","Farad","Ohm","Tesla"],0],["Pendulum T depends:",["Length","Mass","Amplitude","Both"],0],["Critical angle due to:",["Reflection","Refraction","TIR","Diffraction"],2],["Photon E=",["hν","h/ν","ν/h","hc2"],0],["de Broglie λ=",["h/p","p/h","h.p","p2/h"],0],["Half-life:",["Half decay","Full decay","Quarter","Double"],0],["Fission releases:",["Energy","Charge","Momentum","Light"],0],["p-type has:",["Holes majority","Electrons majority","Equal","None"],0],["Zener used as:",["Voltage regulator","Amplifier","Rectifier","Oscillator"],0]];
const baseChem=[["Atomic number =:",["Neutrons","Protons","Nucleons","Molecules"],1],["Ligand is:",["e pair donor","e acceptor","Proton","Neutron"],0],["NH3 is:",["Monodentate","Bidentate","Tridentate","Hexadentate"],0],["Ethane:",["C2H6","C2H4","C2H2","CH4"],0],["Benzene:",["C6H6","C6H12","C5H6","C7H8"],0],["pH neutral water:",["0","7","14","10"],1],["Oxidation:",["Loss of e","Gain of e","Loss of p","Gain of n"],0],["Reduction:",["Loss of e","Gain of e","Loss of n","Gain atoms"],1],["Lewis acid:",["e donor","e acceptor","n donor","Electron"],1],["Lewis base:",["e donor","e acceptor","n donor","Proton"],0],["Coordination no:",["Protons","Donor atoms","Neutrons","Electrons"],1],["O state of O:",["+2","-2","+1","0"],1],["NaCl is:",["Covalent","Ionic","Metallic","Coordinate"],1],["Molarity:",["mol/L","g/L","mol/kg","kg/mol"],0],["Avogadro no:",["6.022e23","3e8","9.8","1.6e-19"],0],["Charge on e:",["Positive","Negative","Zero","Variable"],1],["Catalyst changes:",["Rate","Atomic no","Mass","Protons"],0],["Alcohol group:",["-OH","-COOH","-CHO","-NH2"],0],["Acid group:",["-OH","-COOH","-NH2","-Cl"],1],["CH3OH is:",["Methanol","Ethanol","Methanal","Acid"],0],["EDTA is:",["Hexadentate","Bidentate","Monodentate","Tridentate"],0],["CH4 hybridisation:",["sp3","sp2","sp","dsp2"],0],["Highest boiling:",["H2O","H2S","H2Se","H2Te"],0],["18-carat gold:",["75% gold","100%","50%","90%"],0],["Rusting is:",["Oxidation","Reduction","Sublimation","Evaporation"],0]];
const baseMaths=[["d/dx x2:",["x","2x","x2","2"],1],["d/dx sinx:",["cosx","-cosx","sinx","-sinx"],0],["d/dx cosx:",["sinx","-sinx","cosx","-cosx"],1],["∫1/x:",["x2/2","ln|x|+C","1/x","x+C"],1],["∫cosx:",["sinx+C","-sinx+C","cosx+C","tanx+C"],0],["∫sinx:",["cosx+C","-cosx+C","sinx+C","tanx+C"],1],["sin2+cos2:",["0","1","2","x"],1],["tanx=",["sin/cos","cos/sin","1/sin","1/cos"],0],["log(ab):",["loga+logb","loga-logb","loga/logb","log(a+b)"],0],["Equal rows cols:",["Square","Row","Column","Zero"],0],["Det identity:",["0","1","2","-1"],1],["2x3 elements:",["5","6","8","9"],1],["d/dx ex:",["ex","xex","1","0"],0],["d/dx lnx:",["x","1/x","lnx","ex"],1],["sin-1 1:",["0","π/2","π","2π"],1],["cos-1 1:",["0","π/2","π","2π"],0],["tan-1 1:",["0","π/4","π/2","π"],1],["Prob certain:",["0","1","1/2","-1"],1],["Prob impossible:",["0","1","-1","2"],0],["Degree constant:",["0","1","2","Undefined"],0]];
function expandBank(base,total=600){let out=[];for(let i=0;i<total;i++){let b=base[i%base.length];let setNum=Math.floor(i/base.length)+1;let qText=setNum===1?b[0]:`[Set ${setNum}] ${b[0]}`;out.push([qText,b[1],b[2]]);}return out;}
const physicsBank=expandBank(basePhysics,600);
const chemistryBank=expandBank(baseChem,600);
const mathsBank=expandBank(baseMaths,600);
let unlockedLevel=Number(localStorage.getItem("studyUnlocked"))||1;
let highScore=Number(localStorage.getItem("studyHighScore"))||0;
let currentLevel=1,currentQuestion=0,score=0,answered=false,currentQuestions=[];
function hideAll(){["home","levels","game","result","highScore"].forEach(id=>document.getElementById(id).classList.add("hidden"));}
function showHome(){hideAll();document.getElementById("home").classList.remove("hidden");}
function showLevels(){hideAll();document.getElementById("levels").classList.remove("hidden");renderLevels();}
function showHighScore(){hideAll();document.getElementById("highScore").classList.remove("hidden");document.getElementById("highScoreValue").innerText=highScore;}
function renderLevels(){let g=document.getElementById("levelGrid");g.innerHTML="";for(let i=1;i<=30;i++){let b=document.createElement("button");b.className="level";if(i<unlockedLevel){b.classList.add("done");b.innerHTML="✅<br>LEVEL "+i;b.onclick=()=>startLevel(i);}else if(i===unlockedLevel){b.classList.add("open");b.innerHTML="⚡<br>LEVEL "+i;b.onclick=()=>startLevel(i);}else{b.classList.add("locked");b.innerHTML="🔒<br>LEVEL "+i;b.disabled=true;}g.appendChild(b);}document.getElementById("unlockText").innerText="🔓 Level "+unlockedLevel+" unlocked | Total 1800 Q";}
function generateQuestions(level){let qs=[];let s=(level-1)*20;for(let i=0;i<20;i++){let idx=(s+i)%600;let q=physicsBank[idx];qs.push({subject:"⚡ Physics",text:`Level ${level} Q${s+i+1}: ${q[0]}`,options:q[1],answer:q[2]});}for(let i=0;i<20;i++){let idx=(s+i)%600;let q=chemistryBank[idx];qs.push({subject:"🧪 Chemistry",text:`Level ${level} Q${s+i+21}: ${q[0]}`,options:q[1],answer:q[2]});}for(let i=0;i<20;i++){let idx=(s+i)%600;let q=mathsBank[idx];qs.push({subject:"📐 Maths",text:`Level ${level} Q${s+i+41}: ${q[0]}`,options:q[1],answer:q[2]});}return qs;}
function startLevel(l){currentLevel=l;currentQuestion=0;score=0;answered=false;currentQuestions=generateQuestions(l);hideAll();document.getElementById("game").classList.remove("hidden");loadQuestion();}
function loadQuestion(){let q=currentQuestions[currentQuestion];answered=false;document.getElementById("levelText").innerText="LEVEL "+currentLevel;document.getElementById("scoreText").innerText="Score: "+score;document.getElementById("questionNo").innerText="Question "+(currentQuestion+1)+" / 60";document.getElementById("subjectName").innerText=q.subject;document.getElementById("question").innerText=q.text;let o=document.getElementById("options");o.innerHTML="";q.options.forEach((opt,i)=>{let b=document.createElement("button");b.className="option";b.innerText=String.fromCharCode(65+i)+". "+opt;b.onclick=()=>checkAnswer(i,b);o.appendChild(b);});document.getElementById("nextBtn").classList.add("hidden");document.getElementById("progressBar").style.width=(currentQuestion/60*100)+"%";}
function checkAnswer(s,b){if(answered) return;answered=true;let q=currentQuestions[currentQuestion];let all=document.querySelectorAll(".option");if(s===q.answer){b.classList.add("correct");score++;}else{b.classList.add("wrong");all[q.answer].classList.add("correct");}document.getElementById("scoreText").innerText="Score: "+score;document.getElementById("nextBtn").classList.remove("hidden");}
function nextQuestion(){currentQuestion++;if(currentQuestion>=60) finishLevel(); else loadQuestion();}
function finishLevel(){hideAll();document.getElementById("result").classList.remove("hidden");document.getElementById("finalScore").innerText=score+" / 60";if(score>highScore){highScore=score;localStorage.setItem("studyHighScore",highScore);}if(currentLevel===unlockedLevel && currentLevel<30){unlockedLevel=currentLevel+1;localStorage.setItem("studyUnlocked",unlockedLevel);document.getElementById("resultMessage").innerText="🎉 Excellent! Level "+unlockedLevel+" unlocked!";}else if(currentLevel===30){document.getElementById("resultMessage").innerText="🏆 All 30 Levels (1800 Q) Completed!";}else{document.getElementById("resultMessage").innerText="🎯 Level completed!";}}
showHome();
</script>
</body>
</html>
