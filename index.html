<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Study Quiz Pro - 15 Levels Physics Chemistry Maths Quiz</title>
<meta name="description" content="Study Quiz Pro - 900 Questions, 15 Levels, Physics Chemistry Maths Quiz Game. Play and learn Class 12 level quiz.">
<meta name="keywords" content="study quiz, physics quiz, chemistry quiz, maths quiz, study game, 15 levels quiz, amit maurya quiz">
<meta name="author" content="Amit Maurya">
<meta name="robots" content="index, follow">
<meta property="og:title" content="Study Quiz Pro">
<meta property="og:description" content="Play 15 Levels Physics Chemistry Maths Quiz - 900 Questions">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📚</text></svg>">

<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#eef3ff}
main{max-width:560px;margin:0 auto;padding:12px}.card{background:white;border-radius:22px;padding:18px;box-shadow:0 8px 24px #0001}
button{width:100%;padding:14px;margin:6px 0;border:0;border-radius:12px;background:#315fe8;color:white;font-weight:bold;cursor:pointer}
.level-btn{padding:16px 2px;background:#f1f5ff;color:#1e3a8a;border:2px solid #c7d2fe;border-radius:14px}
.level-btn.locked{background:#e2e8f0;color:#94a3b8}
.option{background:#edf1ff;color:#172554;text-align:left;border:1px solid #dbe4ff}
.option.correct{background:#b9f6ca!important}.option.wrong{background:#fecaca!important}
.hidden{display:none!important}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.install{background:#10b981}.icon{font-size:56px;text-align:center}
.progress{height:8px;background:#e2e8f0;border-radius:10px;overflow:hidden;margin:8px 0}.progress div{height:100%;background:#315fe8;width:0%}
</style>
</head>
<body>
<main><section class="card">
<div class="icon">📚</div>
<h1 style="text-align:center;color:#2857d9">Study Quiz Pro</h1>
<p style="text-align:center">Pehle Level (1-15) → Fir Subject</p>
<button class="install" onclick="alert('Chrome ke 3 dots > Add to Home Screen dabao 📲')" style="display:flex;justify-content:center">📲 Install App</button>

<div id="home"><h3>Choose Level</h3><div class="progress"><div id="mainProgress"></div></div><div id="levelGrid" class="grid"></div></div>

<div id="subjectScreen" class="hidden">
<h3 id="levelInfo"></h3>
<button onclick="selectSubject('Physics')">⚡ Physics</button>
<button onclick="selectSubject('Chemistry')">🧪 Chemistry</button>
<button onclick="selectSubject('Maths')">📐 Maths</button>
<button onclick="goToLevels()" style="background:#64748b">← Back to Levels</button>
</div>

<div id="quiz" class="hidden">
<div id="status" style="text-align:center;background:#f1f5ff;padding:6px;border-radius:8px;font-size:13px"></div>
<div class="progress"><div id="quizProgress"></div></div>
<h3 id="question"></h3><div id="options"></div>
<p id="feedback" style="text-align:center;font-weight:bold"></p>
<button id="next" onclick="nextQuestion()" class="hidden">Next →</button>
<button onclick="backToSubjects()" style="background:#64748b">Back</button>
</div>

</section></main>

<script>
const pools={Physics:["charge:Coulomb","current:Ampere","voltage:Volt","resistance:Ohm","capacitance:Farad"],Chemistry:["pH neutral:7","acid:HCl","base:NaOH","noble gas:Neon","halogen:Chlorine"],Maths:["x^2 derivative:2x","sinx derivative:cosx","cosx derivative:-sinx","e^x derivative:e^x","circle area:pi r2"]};
function makeBank(){let bank={};for(let s in pools){let all=[];let pool=pools[s];for(let i=0;i<300;i++){let b=pool[i%pool.length].split(":");let q=`${b[0]} Q${i+1}?`;let correct=b[1];let others=pool.map(p=>p.split(":")[1]).filter(x=>x!=correct);let opts=[correct,others[0],others[1],others[2]];let r=i%4;opts=opts.slice(r).concat(opts.slice(0,r));all.push([q,opts[0],opts[1],opts[2],opts[3],opts.indexOf(correct)]);}let lv=[];for(let l=0;l<15;l++)lv.push(all.slice(l*20,(l+1)*20));bank[s]=lv;}return bank;}
const bank=makeBank();let selectedLevel=0,subject="",qIndex=0,score=0,currentQs=[];let progress=JSON.parse(localStorage.getItem('qp4')||'{"Physics":[0,0,0,0,0,0,0],"Chemistry":[0,0,0,0,0,0,0],"Maths":[0,0,0,0,0,0,0]}');let globalUnlock=JSON.parse(localStorage.getItem('globalUnlock')||'[1]');
function save(){localStorage.setItem('qp4',JSON.stringify(progress));localStorage.setItem('globalUnlock',JSON.stringify(globalUnlock));renderLevels();}
function renderLevels(){let grid=document.getElementById('levelGrid');grid.innerHTML='';for(let i=0;i<15;i++){let lvl=i+1,ok=globalUnlock.includes(lvl);let btn=document.createElement('button');btn.className='level-btn'+(ok?'':' locked');btn.innerHTML=`Level ${lvl}`;if(ok)btn.onclick=()=>openLevel(i);grid.appendChild(btn);}let tot=Object.values(progress).flat().reduce((a,b)=>a+b,0);document.getElementById('mainProgress').style.width=(tot/900*100)+'%';}
function openLevel(l){selectedLevel=l;document.getElementById('home').classList.add('hidden');document.getElementById('subjectScreen').classList.remove('hidden');document.getElementById('levelInfo').textContent=`Level ${l+1} - Subject Chuno`;}
function goToLevels(){document.getElementById('subjectScreen').classList.add('hidden');document.getElementById('home').classList.remove('hidden');}
function selectSubject(s){subject=s;qIndex=0;score=0;currentQs=[...bank[subject][selectedLevel]].sort(()=>Math.random()-0.5);document.getElementById('subjectScreen').classList.add('hidden');document.getElementById('quiz').classList.remove('hidden');showQuestion();}
function showQuestion(){let q=currentQs[qIndex];document.getElementById('status').textContent=`L${selectedLevel+1} ${subject} Q${qIndex+1}/20`;document.getElementById('quizProgress').style.width=(qIndex/20*100)+'%';document.getElementById('question').textContent=q[0];document.getElementById('feedback').textContent='';document.getElementById('next').classList.add('hidden');let box=document.getElementById('options');box.innerHTML='';q.slice(1,5).forEach((a,i)=>{let b=document.createElement('button');b.className='option';b.textContent=a;b.onclick=()=>answer(i,b);box.appendChild(b);});}
function answer(n,btn){let q=currentQs[qIndex],c=q[5];document.querySelectorAll('.option').forEach((b,i)=>{b.disabled=true;if(i==c)b.classList.add('correct');});if(n==c)score++;else btn.classList.add('wrong');document.getElementById('feedback').textContent=n==c?'Correct! 🎉':'Correct: '+q[c+1];document.getElementById('next').textContent=qIndex==19?'Finish':'Next →';document.getElementById('next').classList.remove('hidden');}
function nextQuestion(){qIndex++;if(qIndex>=20){document.getElementById('question').textContent=`Complete! Score ${score}/20`;document.getElementById('options').innerHTML='';if(score>progress[subject][selectedLevel])progress[subject][selectedLevel]=score;if(score>=12&&!globalUnlock.includes(selectedLevel+2)&&selectedLevel<14)globalUnlock.push(selectedLevel+2);save();document.getElementById('feedback').textContent=score>=12?'Next Level Unlocked 🔓':'Need 12';document.getElementById('next').classList.add('hidden');return;}showQuestion();}
function backToSubjects(){document.getElementById('quiz').classList.add('hidden');document.getElementById('subjectScreen').classList.remove('hidden');}
renderLevels();
</script>
</body>
</html>
