<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Study Quiz Pro</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{

}

.container{
width:100%;

}

.screen{display:none}
.screen.active{display:block}

.card{

}

.logo{

margin-top:25px;
}

.title{
font-size:38px;
font-weight:bold;
text-align:center;

}

.subtitle{
text-align:center;
opacity:.85;
margin-bottom:25px;
}

.btn{
width:100%;
padding:15px;
border:0;
border-radius:15px;
font-size:18px;
font-weight:bold;
cursor:pointer;
margin-top:12px;
background:white;
color:#312e81;
transition:.2s;
}

.btn:hover{
transform:translateY(-2px);

}

.btn.secondary{

}

.stats{

}

.stat{

.stat b{

}

.level-grid{

}

.level{

border:0;
font-size:20px;
font-weight:bold;

}

.level.locked{

}

.level.completed{

color:white;
}

.topbar{
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
margin-bottom:20px;
}

.small-btn{
border:0;
padding:10px 14px;

}

.progress{

background:rgba(255,255,255,.15);
border-radius:20px;
overflow:hidden;
margin:15px 0 25px;
}

.progress-bar{
height:100%;
width:0%;
background:#22c55e;
transition:.3s;
}

.subject{
display:inline-block;
padding:7px 14px;
border-radius:20px;
background:#f59e0b;
font-weight:bold;
font-size:14px;
}

.question-number{
opacity:.75;
margin-top:12px;
}

.question{
font-size:24px;
line-height:1.5;
margin:20px 0;
font-weight:bold;
}

.options{
display:grid;
gap:12px;
}

.option{
padding:15px;
border-radius:14px;
background:rgba(255,255,255,.12);
border:1px solid rgba(255,255,255,.2);
color:white;
font-size:17px;

text-align:left;
}

.option:hover{

}

.option.correct{
background:#16a34a;
}

.option.wrong{
background:#dc2626;
}

.result-icon{
font-size:70px;
text-align:center;
}

.result-score{
font-size:45px;
font-weight:bold;
text-align:center;
margin:10px;
}

.center{text-align:center}

.badge{
display:inline-block;
padding:8px 14px;
border-radius:20px;
background:#22c55e;
margin:5px;
font-weight:bold;
}

.footer{
text-align:center;
opacity:.6;
font-size:13px;
margin-top:25px;
}

@media(max-width:600px){
.container{padding:12px}
.title{font-size:30px}
.logo{font-size:45px}
.level-grid{grid-template-columns:repeat(3,1fr)}
.question{font-size:20px}
.stats{grid-template-columns:1fr 1fr 1fr}

<!-- HOME -->

return [...arr].sort(()=>Math.random()-0.5);
}

return {
subject,
text,
options,

};

/* ================================
   BUILD 1800 QUESTIONS
================================ */

function buildQuestionBank(){

questionBank=[];

for(let level=1;level<=TOTAL_LEVELS;level++){

for(let i=0;i<20;i++){
questionBank.push(
physicsTemplates[i](level,i)
);
}

for(let i=0;i<20;i++){
questionBank.push(
chemistryTemplates[i](level,i)
);
}

for(let i=0;i<20;i++){
questionBank.push(
mathsTemplates[i](level,i)
);
}

}

console.log(
"Total questions generated:",
questionBank.length
);
}


/* ================================
   SCREEN CONTROL
================================ */

function hideAll(){
document.querySelectorAll(".screen")
.forEach(s=>s.classList.remove("active"));
}

function showHome(){
hideAll();
document.getElementById("home").classList.add("active");
updateHome();
}

function showLevels(){
hideAll();
document.getElementById("levels").classList.add("active");
renderLevels();
}

function showQuiz(){
hideAll();
document.getElementById("quiz").classList.add("active");
}


/* ================================
   HOME
================================ */

function updateHome(){

document.getElementById("homeLevel")
.textContent=unlockedLevel;

document.getElementById("homeScore")
.textContent=highScore;

}


/* ================================
   LEVELS
================================ */

function renderLevels(){

const grid=document.getElementById("levelGrid");
grid.innerHTML="";

for(let i=1;i<=TOTAL_LEVELS;i++){

const button=document.createElement("button");

button.className="level";

const completed =
i < unlockedLevel;

const locked =
i > unlockedLevel;

if(completed)
button.classList.add("completed");

if(locked)
button.classList.add("locked");

if(locked){
button.innerHTML="🔒 "+i;
button.disabled=true;
}else{
button.innerHTML=
completed ? "✓ "+i : "▶ "+i;

button.onclick=()=>startLevel(i);
}

grid.appendChild(button);
}

}


/* ================================
   START LEVEL
================================ */

function startLevel(level){

if(level>unlockedLevel){
return;
}

currentLevel=level;

currentQuestions=
questionBank.slice(
(level-1)*60,
level*60
);

currentQuestions=shuffle(currentQuestions);

currentIndex=0;
score=0;

document.getElementById("quizLevel")
.textContent="Level "+level;

showQuiz();

showQuestion();
}


/* ================================
   SHOW QUESTION
================================ */

function showQuestion(){

if(currentIndex>=currentQuestions.length){
finishLevel();
return;
}

const q=currentQuestions[currentIndex];

document.getElementById("subject")
.textContent=q.subject;

document.getElementById("questionNumber")
.textContent=
`Question ${currentIndex+1} / 60`;

document.getElementById("progressBar")
.style.width=
`${((currentIndex)/60)*100}%`;

document.getElementById("question")
.textContent=q.text;

const optionsDiv=
document.getElementById("options");

optionsDiv.innerHTML="";

q.options.forEach((option,index)=>{

const button=document.createElement("button");

button.className="option";
button.textContent=
String.fromCharCode(65+index)+". "+option;

button.onclick=()=>{
selectAnswer(index,button);
};

optionsDiv.appendChild(button);

});

}


/* ================================
   ANSWER
================================ */

function selectAnswer(selected,button){

const q=currentQuestions[currentIndex];

const buttons=
document.querySelectorAll(".option");

buttons.forEach(b=>b.disabled=true);

if(selected===q.answer){

button.classList.add("correct");
score++;

}else{

button.classList.add("wrong");

buttons[q.answer]
.classList.add("correct");

}

setTimeout(()=>{

currentIndex++;
showQuestion();

},600);

}


/* ================================
   FINISH LEVEL
================================ */

function finishLevel(){

document.getElementById("progressBar")
.style.width="100%";

if(score>highScore){
highScore=score;
localStorage.setItem(
"highScore",
highScore
);
}

let unlockedNext=false;

if(
currentLevel===unlockedLevel &&
currentLevel<TOTAL_LEVELS
){

unlockedLevel++;

localStorage.setItem(
"unlockedLevel",
unlockedLevel
);

unlockedNext=true;
}

document.getElementById("resultScore")
.textContent=`${score} / 60`;

if(score>=50){

document.getElementById("resultTitle")
.textContent="🔥 Excellent!";

}else if(score>=35){

document.getElementById("resultTitle")
.textContent="👏 Great Job!";

}else{

document.getElementById("resultTitle")
.textContent="💪 Keep Practising!";

}

if(unlockedNext){

document.getElementById("resultText")
.textContent=
`Level ${currentLevel+1} unlocked! 🎉`;

}else if(currentLevel===TOTAL_LEVELS){

document.getElementById("resultText")
.textContent=
"You completed all 30 levels! 🏆";

}else{

document.getElementById("resultText")
.textContent=
"You can replay this level or continue your practice.";

}

hideAll();

document.getElementById("result")
.classList.add("active");

}


/* ================================
   NEXT ACTION
================================ */

function nextAction(){

if(
currentLevel<TOTAL_LEVELS &&
currentLevel<unlockedLevel
){

startLevel(currentLevel+1);

}else{

showLevels();

}

}


/* ================================
   DOWNLOAD GAME
================================ */

function downloadGame(){

const html=
"<!DOCTYPE html>\n"+
document.documentElement.outerHTML;

const blob=
new Blob([html],{type:"text/html"});

const url=
URL.createObjectURL(blob);

const a=document.createElement("a");

a.href=url;
a.download="StudyQuizPro.html";

document.body.appendChild(a);
a.click();
a.remove();

URL.revokeObjectURL(url);

alert(
"Game downloaded! 📥\n\n"+
"You can save it as an HTML file."
);

}


/* ================================
   RESET
================================ */

function resetGame(){

const confirmReset=
confirm(
