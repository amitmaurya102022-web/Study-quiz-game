<style>
body{font-family:Arial;background:#eef2ff;margin:0;padding:20px;text-align:center}
.card{background:white;max-width:500px;margin:20px auto;padding:20px;border-radius:15px;box-shadow:0 5px 15px rgba(0,0,0,0.1)}
button{padding:12px 20px;border:none;border-radius:8px;background:#4f46e5;color:white;margin:5px;cursor:pointer;font-size:16px}
#installBtn{display:none; position:fixed; bottom:20px; right:20px; background:#000; color:white; padding:14px 22px; border-radius:30px; z-index:9999; box-shadow:0 5px 15px rgba(0,0,0,0.3);}
.ad-box{background:#fff3cd; border:1px dashed #ff9900; padding:10px; margin:15px 0; font-size:12px;}
</style>
</head>
<body>

<div class="ad-box">TOP AD - Yaha aapka Ad ayega (Adsterra Code)</div>

<h1>🧠 Amit Maurya IQ Game</h1>
<div class="card" id="quizBox">
<h2 id="question">Loading...</h2>
<div id="options"></div>
<p id="score">Score: 0</p>
</div>

<div class="ad-box">BOTTOM AD - Yaha aapka Ad ayega</div>

<button id="installBtn">📲 App Install Karo</button>

<script>
// --- GAME LOGIC ---
const quiz=[
{q:"10, 20, 30,?",o:["40","50","35"],a:"40"},
{q:"BILL ka ulta LLIB to ROOM ka ulta?",o:["MOOR","ROOM","MORO"],a:"MOOR"},
{q:"2+2x2=?",o:["8","6","4"],a:"6"}
];
let i=0,sc=0;
function loadQ(){
 if(i>=quiz.length){document.getElementById("quizBox").innerHTML=`<h2>Ho gaya! Score: ${sc}/${quiz.length} <br> By Amit Maurya</h2>`; return;}
 document.getElementById("question").innerText=quiz[i].q;
 let opt=document.getElementById("options"); opt.innerHTML="";
 quiz[i].o.forEach(o=>{
   let b=document.createElement("button"); b.innerText=o;
   b.onclick=()=>{if(o==quiz[i].a)sc++; i++; document.getElementById("score").innerText="Score: "+sc; loadQ();}
   opt.appendChild(b);
 });
}
loadQ();

// --- PWA INSTALL LOGIC (Single File) ---
if ('serviceWorker' in navigator) {
  const swCode = `self.addEventListener('install', e=>self.skipWaiting()); self.addEventListener('activate', e=>self.clients.claim());`;
  const blob = new Blob([swCode], {type: 'application/javascript'});
  navigator.serviceWorker.register(URL.createObjectURL(blob));
}
let deferredPrompt;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault(); deferredPrompt = e;
  document.getElementById('installBtn').style.display = 'block';
});
document.getElementById('installBtn').addEventListener('click', async () => {
  if(deferredPrompt){ deferredPrompt.prompt(); }
});
</script>
</body>
