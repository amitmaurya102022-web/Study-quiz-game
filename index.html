<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Study Quiz Pro - Class 12 PCM</title>
<meta name="monetag" content="5d9d1ee1be1e5a1e0a1c1a1a1a1a1a1a1">
<style>
body{font-family: Arial; background:#f0f4ff; margin:0; padding:15px; text-align:center}
.box{background:white; max-width:500px; margin:20px auto; padding:20px; border-radius:15px; box-shadow:0 4px 15px rgba(0,0,0,0.1)}
h1{color:#4f46e5}
.btn{display:block; width:100%; padding:12px; margin:8px 0; border:2px solid #e0e0e0; border-radius:10px; background:#fff; font-size:16px}
.btn:active{background:#4f46e5; color:white}
#score{font-weight:bold; color:green}
</style>
</head>
<body>
<div class="box">
<h1>📚 Class 12 PCM Quiz</h1>
<p>Score: <span id="score">0</span> | Q: <span id="qnum">1</span>/10</p>
<h3 id="question">Loading...</h3>
<div id="options"></div>
<p id="result"></p>
<button onclick="nextQ()" style="background:#4f46e5;color:white;padding:10px 20px;border:none;border-radius:8px;margin-top:10px;">Next Question</button>
</div>

<script>
const quiz=[
{q:"Physics: Force ka SI unit kya hai?",a:["Joule","Newton","Watt","Pascal"],c:1},
{q:"Chemistry: H2O kya hai?",a:["Acid","Base","Water","Salt"],c:2},
{q:"Maths: sin 90° ka maan?",a:["0","1","0.5","-1"],c:1},
{q:"Physics: Light ki speed kitni hai?",a:["3x10^8 m/s","3x10^6 m/s","3x10^5 m/s","3x10^7 m/s"],c:0},
{q:"Chemistry: NaCl kya hai?",a:["Chini","Namak","Acid","Base"],c:1},
{q:"Maths: d/dx(x²) =?",a:["x","2x","x²","2"],c:1},
{q:"Physics: Power ka formula?",a:["F×d","W/t","m×a","mv"],c:1},
{q:"Chemistry: pH 7 matlab?",a:["Acidic","Basic","Neutral","Salt"],c:2},
{q:"Maths: π ka value?",a:["3.14","2.14","4.14","3.0"],c:0},
{q:"Biology (Extra): DNA ka full form?",a:["Deoxyribonucleic Acid","Data Acid","Double Acid","None"],c:0}
];
let idx=0, score=0;
function showQ(){
  document.getElementById("qnum").innerText=idx+1;
  document.getElementById("question").innerText=quiz[idx].q;
  let html="";
  quiz[idx].a.forEach((opt,i)=>{
    html+=`<button class="btn" onclick="check(${i})">${opt}</button>`;
  });
  document.getElementById("options").innerHTML=html;
  document.getElementById("result").innerText="";
}
function check(i){
  if(i===quiz[idx].c){
    score++;
    document.getElementById("score").innerText=score;
    document.getElementById("result").innerText="✅ Sahi Jawab!";
  } else {
    document.getElementById("result").innerText="❌ Galat Jawab! Sahi hai: "+quiz[idx].a[quiz[idx].c];
  }
}
function nextQ(){
  idx++;
  if(idx<quiz.length){ showQ(); }
  else {
    document.getElementById("question").innerText="Quiz Khatam! Final Score: "+score+"/10";
    document.getElementById("options").innerHTML="<button class='btn' onclick='location.reload()'>Fir se Khelo</button>";
  }
}
window.onload=showQ;
</script>
</body>
</html>
