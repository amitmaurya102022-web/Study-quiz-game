<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="monetag" content="1cd3c9d3b8f1d9fbc1cfb1ba1eacbc1a6">
<title>Study Quiz Pro</title>
<style>
body{font-family:Arial;text-align:center;background:#f0f4ff;margin:0}
.header{background:white;padding:15px;box-shadow:0 2px 5px #ccc}
#quiz{max-width:400px;margin:20px auto;background:white;padding:20px;border-radius:15px;box-shadow:0 4px 10px #ccc}
button{width:100%;padding:12px;margin:8px 0;border:0;border-radius:8px;background:#4a6cf7;color:white;font-size:16px}
button:active{background:#2d4de0}
</style>
</head>
<body>
<div class="header">
  <div style="font-size:50px">📚</div>
  <h2>Study Quiz Pro</h2>
  <div>❤️ <span id="lives">3</span> Lives | Level: <span id="level">1</span></div>
</div>

<div id="quiz">
  <h3 id="question">Loading...</h3>
  <div id="options"></div>
  <p id="msg"></p>
</div>

<script>
// === EARNING SETTING ===
const AD_LINK = "YAHAN_APNA_LINK_DALO"; // <-- yahan apna Adsterra/Monetag DirectLink dalo

let lives = 3;
let level = 1;
let qIndex = 0;

const questions = [
 {q:"Bharat ka Rashtriya Pashu kaun hai?", o:["Sher","Bagh","Hathi","Gai"], a:1},
 {q:"Computer ka dimag kise kehte hain?", o:["RAM","CPU","Keyboard","Mouse"], a:1},
 {q:"Ganga nadi kahan se nikalti hai?", o:["Yamuna","Gangotri","Himalaya","Ladakh"], a:1},
 {q:"1 GB me kitne MB hote hain?", o:["100","1024","500","1000"], a:1},
 {q:"HTML ka full form?", o:["High Text","HyperText Markup Language","Hello Text","None"], a:1}
];

function showQ(){
  if(qIndex >= questions.length){
    document.getElementById("question").innerText = "🎉 Level Complete!";
    document.getElementById("options").innerHTML = `<button onclick="nextLevel()">Next Level - Ad Dekho</button>`;
    // Earning Ad on Level Complete
    if(AD_LINK.startsWith("http")) window.open(AD_LINK, "_blank");
    return;
  }
  let q = questions[qIndex];
  document.getElementById("question").innerText = q.q;
  let html = "";
  q.o.forEach((opt,i)=>{
    html += `<button onclick="checkAns(${i})">${opt}</button>`;
  });
  document.getElementById("options").innerHTML = html;
}

function checkAns(i){
  if(i === questions[qIndex].a){
    qIndex++;
    // Har 2 sawal par ad
    if(qIndex % 2 == 0 && AD_LINK.startsWith("http")){
      window.open(AD_LINK, "_blank");
    }
    showQ();
  } else {
    lives--;
    document.getElementById("lives").innerText = lives;
    document.getElementById("msg").innerText = "❌ Galat jawab! Koshish karo";
    if(lives <=0){
      alert("Game Over! Fir se shuru karo");
      lives=3; level=1; qIndex=0;
      document.getElementById("lives").innerText = lives;
    }
  }
}

function nextLevel(){
  level++;
  qIndex=0;
  document.getElementById("level").innerText = level;
  document.getElementById("msg").innerText = "";
  showQ();
}

showQ();
</script>
</body>
</html>
