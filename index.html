<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>PCM Master 1800</title><style>body{background:#0f172a;color:#fff;font-family:Arial;margin:0;padding:10px}.h{background:linear-gradient(90deg,#6a11cb,#2575fc);padding:15px;text-align:center;border-radius:10px}.ad{background:#1e293b;margin:10px 0;padding:10px;text-align:center;border:1px dashed gray;border-radius:8px}.g{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.c{background:#1e293b;padding:12px;text-align:center;border-radius:10px;border:2px solid #334155}.c.ok{border-color:#22c55e}.b{width:100%;padding:6px;margin-top:5px;border:0;border-radius:6px;font-weight:bold}.play{background:#22c55e;color:#fff}#q{position:fixed;top:0;left:0;width:100%;height:100%;background:#0f172a;z-index:99;display:none;padding:15px}.o{background:#1e293b;padding:10px;margin:6px 0;border-radius:8px;border:1px solid #475569}</style></head><body><div class="h"><h2>📚 PCM MASTER - 1800 Qs</h2><p>Board | NCERT | JEE - 30 Levels</p></div><div class="ad">AD TOP</div><div id="lv" class="g"></div><div class="ad">AD BOTTOM - Google Ad Yaha Aayega</div><div id="q"><h3 id="qt"></h3><h2 id="qtx" style="margin:12px 0"></h2><div id="qo"></div><button onclick="document.getElementById('q').style.display='none'" style="width:100%;padding:10px;margin-top:15px">Exit</button></div><script>
let ul=parseInt(localStorage.getItem('ul')||'1');let bank=[];
for(let L=1;L<=30;L++){for(let i=0;i<60;i++){let s=['Phy','Che','Math'][i%3];bank.push({L:L,s:s,q:`[L${L}-${s}] Q${i+1}: Yaha apna question likhe`,a:0,op:['A) Option 1','B) Option 2','C) Option 3','D) Option 4']})}}
function draw(){let h='';for(let i=1;i<=30;i++){let t=i<=10?'BOARD':i<=20?'NCERT':'JEE';let lk=i>ul;h+=`<div class="c ${lk?'':'ok'}"><b>${i}</b><br><small>${t}</small><br><small>60 Qs</small><br>${lk?'<button class="b">🔒</button>':`<button class="b play" onclick="play(${i})">PLAY</button>`}</div>`}document.getElementById('lv').innerHTML=h}draw();
let cur,idx,sc;
function play(l){cur=bank.filter(x=>x.L==l);idx=0;sc=0;document.getElementById('q').style.display='block';show()}
function show(){let qq=cur[idx];document.getElementById('qt').innerText=`Level ${qq.L} - ${qq.s} ${idx+1}/${cur.length}`;document.getElementById('qtx').innerText=qq.q;document.getElementById('qo').innerHTML=qq.op.map((o,i)=>`<div class="o" onclick="ans(${i})">${o}</div>`).join('')}
function ans(i){if(i==cur[idx].a)sc++;idx++;if(idx<cur.length)show();else{alert(`Score ${sc}/${cur.length}`);if(sc>=15&&cur[0].L==ul&&ul<30){ul++;localStorage.setItem('ul',ul)}document.getElementById('q').style.display='none';draw()}}
</script></body></html>
